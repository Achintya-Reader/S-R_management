<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - SMS3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>.login-wrap{max-width:420px;margin:90px auto;padding:25px;border:1px solid #ddd;border-radius:10px;background:#fff}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:7px;margin-bottom:12px;display:none}</style>
</head>
<body>
<div class="login-wrap">
  <h2>Login</h2>
  <div id="error" class="error"></div>
  <form id="loginForm">
    <div class="mb-3"><label>Email</label><input class="form-control" type="email" name="email" required value="admin@sms3.com"></div>
    <div class="mb-3"><label>Password</label><input class="form-control" type="password" name="password" required value="admin123"></div>
    <button class="btn btn-primary w-100" type="submit">Sign in</button>
    <div class="mt-3 small text-muted">Firebase Auth - create user in Console > Auth > Users first.<br>Default after migrate: admin@sms3.com / admin123</div>
  </form>
</div>
<script type="module">
import { auth, signInWithEmailAndPassword, onAuthStateChanged } from "./js/firebase.js";
onAuthStateChanged(auth, u=>{ if(u) location.href='index.html'; });
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const email=fd.get('email'), password=fd.get('password');
  const err=document.getElementById('error');
  err.style.display='none';
  try{ await signInWithEmailAndPassword(auth,email,password); location.href='index.html'; }
  catch(ex){ err.textContent=ex.message; err.style.display='block'; }
});
</script>
</body>
</html>
