name = "s-r-management"
compatibility_date = "2024-01-01"

# For Cloudflare Pages (recommended): Build command = (empty), Output = "." — no wrangler deploy needed
# For fallback if dashboard still runs `npx wrangler deploy`, serve static as Workers Assets:
[assets]
directory = "."
not_found_handling = "single-page-application"

# To deploy via CLI correctly for Pages use:
#   npx wrangler pages deploy ./ --project-name=s-r-management
# (not `npx wrangler deploy`)
